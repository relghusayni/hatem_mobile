<!DOCTYPE html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SE CEO Companion</title>
<style>
:root{--ink:#111A33;--ink2:#2B3757;--blue:#3E68B4;--blued:#1F4788;--blue3:#17335F;
--orange:#DE8434;--amber:#F2C94C;--slate:#8792AD;--slate2:#A9B2C8;--mist:#EDF1F9;
--paper:#F6F8FC;--teal:#2FA8A5;--g:#2E9E63;--a:#DE9022;--r:#D6483F;--line:#E4E9F4}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Segoe UI',system-ui,-apple-system,sans-serif;background:#DDE4F0;
display:flex;justify-content:center;align-items:center;min-height:100vh;padding:20px}
.num{font-variant-numeric:tabular-nums}
.phone{width:390px;height:844px;background:var(--paper);border-radius:44px;overflow:hidden;
position:relative;box-shadow:0 24px 70px rgba(17,26,51,.35),0 0 0 11px #131722,0 0 0 13px #2A3040;
display:flex;flex-direction:column}
.sbar{height:44px;display:flex;align-items:center;justify-content:space-between;padding:0 26px;
font-size:13px;font-weight:650;color:var(--ink);flex-shrink:0}
.appbar{display:flex;align-items:center;gap:10px;padding:6px 16px 12px;flex-shrink:0}
.appbar .chip{background:#fff;border-radius:9px;padding:4px 8px;box-shadow:0 1px 4px rgba(17,26,51,.08)}
.appbar .chip img{height:30px;display:block}
.appbar h1{font-size:15px;font-weight:800;color:var(--blue3)}
.appbar .d{font-size:10px;color:var(--slate)}
.push{position:absolute;top:-90px;left:12px;right:12px;background:rgba(19,23,34,.94);color:#fff;
border-radius:16px;padding:11px 14px;z-index:50;transition:top .5s cubic-bezier(.3,1.1,.4,1);
display:flex;gap:10px;align-items:flex-start;cursor:pointer;backdrop-filter:blur(8px)}
.push.show{top:52px}
.push .dot{width:8px;height:8px;border-radius:50%;background:var(--r);margin-top:5px;flex-shrink:0}
.push b{font-size:12px;display:block}.push p{font-size:11px;color:#C7CFDF;margin-top:2px;line-height:1.4}
.push .t{font-size:9px;color:#8791A6;margin-left:auto;flex-shrink:0}
.body{flex:1;overflow-y:auto;padding:2px 14px 14px;scrollbar-width:none}
.body::-webkit-scrollbar{display:none}
.card{background:#fff;border:1px solid var(--line);border-radius:15px;padding:13px 14px;margin-bottom:10px}
.lab{font-size:9.5px;font-weight:800;letter-spacing:.09em;color:var(--slate);text-transform:uppercase;margin-bottom:8px}
.aitag{display:inline-flex;align-items:center;gap:4px;font-size:8.5px;font-weight:800;color:var(--blued);
background:var(--mist);border-radius:5px;padding:2px 6px;letter-spacing:.06em}
.brieftxt{font-size:12.5px;line-height:1.55;color:var(--ink2);margin-top:7px}
.brieftxt b{color:var(--ink)}
.alert{display:flex;gap:9px;padding:9px 0;border-top:1px solid var(--mist);align-items:flex-start}
.alert:first-of-type{border-top:none}
.alert .dot{width:7px;height:7px;border-radius:50%;margin-top:4px;flex-shrink:0}
.alert p{font-size:11.5px;line-height:1.45;color:var(--ink2);flex:1}
.alert .t{font-size:9px;color:var(--slate2);flex-shrink:0;margin-top:2px}
.dec{border:1px solid var(--line);border-left-width:3px;border-radius:12px;padding:11px 12px;margin-bottom:9px;background:#fff}
.dec .top{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.dec .t{font-size:12.5px;font-weight:700;color:var(--ink);line-height:1.3}
.dec .amt{font-size:13px;font-weight:800;flex-shrink:0}
.dec .s{font-size:11px;color:var(--ink2);margin-top:3px;line-height:1.45}
.dec .due{font-size:10px;color:var(--orange);font-weight:700;margin-top:4px}
.dec .btns{display:flex;gap:7px;margin-top:9px}
.dec button{flex:1;border:none;border-radius:9px;padding:9px 0;font-size:11.5px;font-weight:700;
font-family:inherit;cursor:pointer;transition:all .15s}
.dec .ap{background:var(--blued);color:#fff}.dec .df{background:var(--mist);color:var(--ink2)}
.dec.done .btns{display:none}
.dec .decided{display:none;font-size:11px;font-weight:700;margin-top:8px;padding:7px 10px;border-radius:8px}
.dec.done .decided{display:block}
.trk{display:flex;justify-content:space-between;gap:8px;padding:9px 0;border-top:1px solid var(--mist);align-items:baseline}
.trk:first-of-type{border-top:none}
.trk .t{font-size:11.5px;font-weight:650;color:var(--ink);line-height:1.3}
.trk .o{font-size:9.5px;color:var(--slate);margin-top:2px}
.trk .st{font-size:9.5px;font-weight:800;flex-shrink:0}
.ring{position:relative;width:64px;height:64px;margin:0 auto}
.ring svg{transform:rotate(-90deg)}
.ring .v{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
font-size:16px;font-weight:800;color:var(--ink)}
.h3{display:flex;gap:8px;margin-bottom:10px}
.h3 .c{flex:1;background:#fff;border:1px solid var(--line);border-radius:14px;padding:11px 6px;text-align:center}
.h3 .n{font-size:9.5px;font-weight:700;color:var(--ink2);margin-top:6px}
.kpi{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--mist)}
.kpi:first-of-type{border-top:none}
.kpi .bar{width:3px;height:30px;border-radius:2px;flex-shrink:0}
.kpi .mid{flex:1;min-width:0}
.kpi .n{font-size:11.5px;font-weight:650;color:var(--ink)}
.kpi .t{font-size:9.5px;color:var(--slate);margin-top:1px}
.kpi .v{font-size:14px;font-weight:800;text-align:right}
.kpi .d{font-size:9.5px;font-weight:700;text-align:right}
.kpi svg{flex-shrink:0}
.desk{display:block;text-align:center;font-size:11px;font-weight:700;color:var(--blue);
padding:11px;background:var(--mist);border-radius:11px;text-decoration:none;margin-top:4px}
.chat{display:flex;flex-direction:column;gap:9px}
.qb{align-self:flex-end;background:var(--blued);color:#fff;border-radius:14px 14px 4px 14px;
padding:9px 13px;font-size:12px;max-width:85%;line-height:1.4}
.ab{align-self:flex-start;background:#fff;border:1px solid var(--line);border-radius:14px 14px 14px 4px;
padding:10px 13px;font-size:12px;color:var(--ink2);max-width:92%;line-height:1.55}
.sugg{display:block;width:100%;text-align:left;background:#fff;border:1px solid var(--line);
border-radius:11px;padding:10px 13px;font-size:11.5px;color:var(--blued);font-weight:650;
font-family:inherit;cursor:pointer;margin-bottom:7px}
.askbar{display:flex;align-items:center;gap:8px;background:#fff;border:1px solid var(--line);
border-radius:13px;padding:10px 13px;margin-top:10px}
.askbar input{flex:1;border:none;outline:none;font-size:12px;font-family:inherit;color:var(--ink);background:none}
.askbar button{border:none;background:none;cursor:pointer;display:flex;padding:0}
.vbul{font-size:12px;line-height:1.5;color:var(--ink2);display:flex;gap:8px;margin-top:7px;align-items:baseline}
.vbul i{width:7px;height:7px;border-radius:50%;flex-shrink:0;position:relative;top:-1px}
.vbul b{color:var(--ink);white-space:nowrap}
.pred{border-left:3px solid;border-radius:10px;background:#fff;padding:10px 12px;margin-top:9px;border:1px solid var(--line);border-left-width:3px}
.pred .cat{font-size:8.5px;font-weight:800;letter-spacing:.08em;text-transform:uppercase}
.pred .h{font-size:12px;font-weight:700;color:var(--ink);margin-top:3px;line-height:1.35}
.pred .cf{font-size:9.5px;color:var(--slate);float:right}
.nav{display:flex;border-top:1px solid var(--line);background:#fff;flex-shrink:0;padding:7px 4px 20px}
.nav button{flex:1;border:none;background:none;font-family:inherit;cursor:pointer;
display:flex;flex-direction:column;align-items:center;gap:3px;font-size:9px;font-weight:700;color:var(--slate2);padding:4px 0}
.nav button.on{color:var(--blued)}
.nav button svg{stroke:currentColor}
.badge{position:absolute;margin-left:26px;margin-top:-3px;background:var(--r);color:#fff;font-size:8px;
font-weight:800;border-radius:8px;padding:1px 5px}
.foot{font-size:8.5px;color:var(--slate2);text-align:center;line-height:1.5;margin-top:6px}
</style></head><body>

function spark(sp,c,w=74,h=24){
  const mn=Math.min(...sp),mx=Math.max(...sp),r=mx-mn||1;

  return `<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}"><polyline points="${pts}" fill="none" stroke="${c}" stroke-width="1.8" stroke-linecap="round"/></svg>`;}

      <span class="mid"><div class="n">${k.n} <span style="font-size:7.5px;font-weight:800;color:var(--slate);background:var(--mist);border-radius:4px;padding:1px 5px;vertical-align:1px">${k.b||""}</span></div><div class="t">${k.d}</div>
        ${ko&&k.i?`<div style="font-size:10.5px;line-height:1.45;color:var(--ink2);background:${confOf(k)[0]>=CTHR?"var(--mist)":"#FDECEC"};border-radius:8px;padding:7px 9px;margin-top:6px">✦ ${confOf(k)[0]>=CTHR?k.i:`<b>Confidence below threshold.</b> ${confOf(k)[1]||"Cause under investigation."}`}</div>`:""}</span>
      <span style="text-align:right">${confOf(k)[0]>=CTHR?`<div class="v num" style="font-size:13px">${k.v}</div>`:`<div class="v num" style="font-size:13px;color:var(--slate)">${k.v}</div>`}${(()=>{const c=confOf(k)[0];return `<div style="display:inline-block;margin-top:3px;font-size:8px;font-weight:800;color:${confCol(c)};background:${confBg(c)};border-radius:6px;padding:1px 6px">Conf. ${c}</div>`;})()}</span></div>`;}).join("")}</div>`:""}</div>`;}).join("")}
  <a class="desk" href="#" onclick="return false">Explore in SEPulse desktop →</a>
  <p class="foot">KPI structure mirrors the SE Pulse dashboard · tap any KPI for the AI insight</p>`;}

function vAsk(){
  const sug=["What should I focus on today?","Why did SAIDI deteriorate?","Which regions are underperforming?","Where does the year-end position land?"];
  return `${chat.length?`<div class="chat">${chat.map(m=>`<div class="${m.u?"qb":"ab"}">${m.t}</div>`).join("")}</div>`:
    `<div style="text-align:center;color:var(--slate2);font-size:11px;padding:26px 0 8px">Ask about performance — or tap a suggestion below</div>`}
  <div class="askbar"><input id="qq" placeholder="Ask SE Intelligence…" onkeydown="if(event.key==='Enter')askQ(this.value)"/>
    <button title="Voice input — Arabic & English" style="color:var(--slate)">${I("mic",15)}</button>
    <button onclick="askQ(document.getElementById('qq').value)" style="color:var(--blue)">${I("send",15)}</button></div>
  <div style="margin-top:8px;line-height:2">${sug.map(s=>`<span onclick="askQ('${s.replace(/'/g,"\'")}')" style="display:inline-block;font-size:10px;color:var(--slate);cursor:pointer;margin-right:11px;text-decoration:underline dotted;text-underline-offset:2px">${s}</span>`).join("")}</div>`;}

function vSettings(){
  const tog=(k)=>`<span onclick="settings.${k}=!settings.${k};render()" style="width:38px;height:22px;border-radius:12px;background:${settings[k]?'var(--g)':'var(--slate2)'};position:relative;cursor:pointer;flex-shrink:0;transition:background .15s">
    <i style="position:absolute;top:2px;${settings[k]?'right:2px':'left:2px'};width:18px;height:18px;border-radius:50%;background:#fff"></i></span>`;
  const row=(t,s,r)=>`<div style="display:flex;justify-content:space-between;align-items:center;border-top:1px solid var(--mist);padding:12px 0">
    <span><div style="font-size:12px;font-weight:650;color:var(--ink)">${t}</div>
    <div style="font-size:9.5px;color:var(--slate);margin-top:1px">${s}</div></span>${r}</div>`;
  return `<div class="card"><div class="lab">Notifications</div>
    ${row("Critical alert push","",tog("push"))}
    ${row("Morning brief","Delivered daily at 06:30",tog("brief"))}</div>
  <div class="card"><div class="lab">Assistant</div>
    ${row("Voice input","Arabic & English",tog("voice"))}
    ${row("Language","English · العربية","<span style='color:var(--slate2);font-size:11px'>›</span>")}</div>
  <div class="card"><div class="lab">Account</div>
    ${row("Profile","Chief Executive Officer · Saudi Energy","<span style='color:var(--slate2);font-size:11px'>›</span>")}
    ${row("Data & privacy","Biometric sign-in · MDM enrolled","<span style='color:var(--slate2);font-size:11px'>›</span>")}
    ${row("About","SE Companion · prototype build","<span style='color:var(--slate2);font-size:11px'>›</span>")}</div>
  <p class="foot">Settings are illustrative in the prototype</p>`;}

function decide(id,what){decided[id]=what;render();}
function decideAll(what){ACTIONS.forEach(d=>{if(d.ty==='D'&&!decided[d.id])decided[d.id]=what;});render();}
function addTodo(v){if(!v||!v.trim())return;ACTIONS.push({id:Date.now(),issue:v.trim(),impact:"Added by you",sponsor:"Personal",due:"—",s:"A",amt:"",ty:"T"});addingTodo=false;render();}
function undo(id){delete decided[id];render();}
function askQ(q){if(!q||!q.trim())return;
  const hit=QA.find(x=>x.k.some(k=>q.toLowerCase().includes(k)));
  chat.push({u:1,t:q});
  chat.push({u:0,t:hit?hit.a:"I could not match that to the demo dataset \u2014 try one of the suggested questions, or explore the full dashboard on desktop."});
  render();
  setTimeout(()=>{const b=document.getElementById('body');b.scrollTop=b.scrollHeight;},30);}
function openPush(){document.getElementById('push').classList.remove('show');TAB="Brief";render();}

const TABS=[["Brief","brief"],["Tasks","act"],["KPIs","kpi"],["Ask","ask"],["Settings","gear"]];
function render(){
  const V={Brief:vBrief,Tasks:vTasks,KPIs:vKPIs,Ask:vAsk,Settings:vSettings};
  document.getElementById('body').innerHTML=V[TAB]();
  const open=ACTIONS.filter(d=>!decided[d.id]).length;
  document.getElementById('nav').innerHTML=TABS.map(([t,ic])=>
    `<button class="${TAB===t?"on":""}" onclick="TAB='${t}';render()">${I(ic,20)}${t==="Tasks"&&open?`<span class="badge num">${open}</span>`:""}<span>${t}</span></button>`).join("");
}
render();
setTimeout(()=>document.getElementById('push').classList.add('show'),900);
setTimeout(()=>document.getElementById('push').classList.remove('show'),9000);
</script></body></html>
